name: Clean installation and imports
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.8.3'
      - uses: TeX-Live/setup-texlive-action@v3
        with:
          version: '2025'
          cache: false
          package-file: tests/texlive-packages.txt
      - name: Install Python dependencies as documented
        run: python -m pip install -r tests/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Actual CLI imports, builds, render and version capture
        run: python tests/smoke_clean.py
      - name: Retain versions and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.os }}-python-${{ matrix.python }}
          path: output/
          retention-days: 14
